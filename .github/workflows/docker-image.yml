name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Navigate to project directory
        run: cd pdp-ui && ls -la  # Verify directory contents

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        working-directory: ./pdp-ui
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ./pdp-ui
        run: ./gradlew clean bootJar --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pdp-ui  # Point to your project directory
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pdp-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pdp-ui:${{ github.sha }}
            
    - name: Login to OpenShift
      run: |
        echo "$OPENSHIFT_TOKEN" | oc login --token=$(cat -) --server="$OPENSHIFT_SERVER"

      env:
        OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}

    - name: Set new image for deployment
      run: |
        oc set image deployment/pdp-ui pdp-ui=docker.io/akhilkm02/pdp-ui:latest -n akhilkm02-dev

    - name: Force rollout restart (optional if using unique image tags)
      run: |
        oc rollout restart deployment/pdp-ui -n akhilkm02-dev