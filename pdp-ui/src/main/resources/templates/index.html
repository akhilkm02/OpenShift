<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${productName}">${productName}</title>
    <style>
        body {
          font-family: 'Segoe UI', sans-serif;
          background: #f2f5f7;
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
        }
        .card {
          background: #ffffff;
          max-width: 400px;
          margin: 30px;
          border-radius: 12px;
          box-shadow: 0 8px 20px rgba(0,0,0,0.1);
          overflow: hidden;
        }
        .card img {
          width: 100%;
          height: auto;
        }
        .card-body {
          padding: 20px;
        }
        .product-title {
          font-size: 1.5em;
          color: #333;
          margin: 0;
        }
        .product-desc {
          color: #666;
          margin: 10px 0;
        }
        .price {
          font-size: 1.4em;
          color: #e91e63;
          margin-bottom: 20px;
        }
        .btn {
          display: inline-block;
          padding: 12px 20px;
          background: #4caf50;
          color: white;
          text-align: center;
          border: none;
          border-radius: 6px;
          font-size: 1em;
          cursor: pointer;
          text-decoration: none;
          transition: background 0.3s ease;
        }
        .btn:hover {
          background: #45a049;
        }
    </style>
</head>
<body>
<div class="card">
    <img src="https://images.samsung.com/is/image/samsung/assets/in/smartphones/galaxy-s23/images/galaxy-s23-highlights-kv.jpg" alt="Phone Image">
    <div class="card-body">
        <h2 class="product-title">Samsung Galaxy S23 </h2>
        <p class="product-desc">6.1" AMOLED Display, Snapdragon 8 Gen 2, 50MP Camera, 8GB RAM, 128GB Storage.</p>
        <p class="price">₹74,999</p>
        <button class="btn">Add to Cart</button>
    </div>
</div>
</body>
</html>
